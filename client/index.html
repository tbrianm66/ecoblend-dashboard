<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>EcoBlend — VBS Analytics Dashboard</title>
    <meta name="description" content="EcoBlend Venture Builder Studio — portfolio intelligence platform tracking Venture Readiness Level (VRL) and Technology Readiness Level (TRL) across active ventures." />

    <!-- Early connection hints — placed before everything else so DNS/TLS resolves ASAP -->
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Image CDN: serves sidebar logo, venture logos, and hero background on first paint -->
    <link rel="preconnect" href="https://d2xsxph8kpxj0f.cloudfront.net" crossorigin />
    <link rel="dns-prefetch" href="https://d2xsxph8kpxj0f.cloudfront.net" />
    <!-- Preload the font CSS at high priority to kick off font file fetches sooner -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "EcoBlend VBS Analytics Dashboard",
      "description": "EcoBlend Venture Builder Studio — portfolio intelligence platform tracking Venture Readiness Level (VRL) and Technology Readiness Level (TRL) across active ventures.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "provider": {
        "@type": "Organization",
        "name": "EcoBlend"
      }
    }
    </script>

    <!-- Canonical URL (kept in sync with client-side navigation) -->
    <link rel="canonical" href="/" id="canonical-url" />
    <script>
      (function () {
        var canonical = document.getElementById("canonical-url");
        function update() {
          canonical.href = window.location.origin + window.location.pathname;
        }
        update();
        var _pushState = history.pushState;
        var _replaceState = history.replaceState;
        history.pushState = function () { _pushState.apply(this, arguments); update(); };
        history.replaceState = function () { _replaceState.apply(this, arguments); update(); };
        window.addEventListener("popstate", update);
      })();
    </script>

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EcoBlend — VBS Analytics Dashboard" />
    <meta property="og:description" content="EcoBlend Venture Builder Studio — portfolio intelligence platform tracking Venture Readiness Level (VRL) and Technology Readiness Level (TRL) across active ventures." />
    <meta property="og:site_name" content="EcoBlend VBS" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EcoBlend — VBS Analytics Dashboard" />
    <meta name="twitter:description" content="EcoBlend Venture Builder Studio — portfolio intelligence platform tracking Venture Readiness Level (VRL) and Technology Readiness Level (TRL) across active ventures." />

    <!-- Favicon & PWA manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#51AF37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EcoBlend VBS" />

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
